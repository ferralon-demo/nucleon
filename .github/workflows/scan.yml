name: scan

# Runs the prebuilt nucleon scanner (committed under bin/) against the sample target and
# publishes the full tiered result set. No source for the scanner ships here — only the
# hardened binaries. The target is a tiny Go module depending on golang.org/x/text v0.3.6,
# so the baseline produces a populated SBOM and a real candidate finding.
#
# Tier-1 API surfaces (SARIF code scanning / sticky PR comment / pinned Issue) need a write
# token; the binary reads it from GITHUB_TOKEN, mapped explicitly below. They auto-skip on
# forked PRs (read-only token). Tier-2 Pages is opt-in via NUCLEON_PAGES and deployed only on
# push to main by the gated deploy job.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # SARIF -> code scanning upload
      pull-requests: write      # sticky PR comment
      issues: write             # pinned Issue dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: false

      - name: Warm the module cache for the target
        working-directory: target
        run: go build ./...

      - name: Run the scan
        id: scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUCLEON_PAGES: "1"
        run: |
          chmod +x bin/nucleon bin/nucleon-plugin
          mkdir -p "$RUNNER_TEMP/out"
          ./bin/nucleon baseline \
            -target target \
            -out "$RUNNER_TEMP/out" \
            -plugin-go "$GITHUB_WORKSPACE/bin/nucleon-plugin" \
            -subject-repo "${{ github.repository }}" \
            -revision "${{ github.ref_name }}" \
            -commit "${{ github.sha }}"
          echo "out=$RUNNER_TEMP/out" >> "$GITHUB_OUTPUT"

      - name: Upload reports as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: |
            ${{ steps.scan.outputs.out }}/report.html
            ${{ steps.scan.outputs.out }}/report.sarif.json
            ${{ steps.scan.outputs.out }}/report.json
            ${{ steps.scan.outputs.out }}/openvex.json
          if-no-files-found: error

      - name: Upload SARIF to code scanning
        # Skip on forked PRs (read-only token can't write code scanning).
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan.outputs.out }}/report.sarif.json
          category: nucleon

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
