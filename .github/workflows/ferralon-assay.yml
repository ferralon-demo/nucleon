# Ferralon Assay — free, deterministic dependency-advisory scan, run in this
# repository's own GitHub runner via the ferralon-ai/ferralon-assay Action, following the
# floating @v0.3 alias so patch releases land without per-patch churn (scanner bytes stay
# exact via the alias leaf's scanner-version default; sha-pin the leaf for an exact-patch
# posture instead).
#
# This is nucleon's single scan workflow. It replaces the old in-repo path (the committed
# bin/nucleon binary driven by scan.yml): the Action fetches a versioned scanner release at
# run time and builds nothing — no scanner binary is committed to this repository.
#
# What it does, in this repository's own runner (no source leaves the repo):
#   1. warms the Go module cache for the sample target so the scanner's Go analyzer can load
#      it with go/packages;
#   2. runs the scanner over target/ -> report.json / report.html / report.sarif.json /
#      openvex.json, uploaded as the `scan-report` build artifact;
#   3. publishes the scanner's own surfaces — SARIF code scanning, a pinned Issue dashboard,
#      and a sticky PR comment;
#   4. on the default branch only, persists the StateStore baseline to refs/tegron/state
#      (a PR run stays stateless and never overwrites the baseline).
#
# FIXTURE LAYOUT STANDARD (pipeline-test 1.3, 2026-09-22). `vulnerable` (and the reference
# patch `fix`) are GOLDEN: never scanned, never the default branch, protected per repo in the
# backend. `main` is the default branch, the only scanned branch, and the disposable fire
# target — reset from `vulnerable` with `.demo/prep-demo.sh`. The push filter below names
# `main`; before this change every branch push was scanned. GitHub matches the filter against
# the copy of this file ON THE PUSHED BRANCH, so every branch's copy must name `main`.
#
# Removing Ferralon: delete this file (a direct commit or a PR both work) and, optionally,
# `git push origin --delete refs/tegron/state`.

name: Ferralon Assay

on:
  pull_request:
  push:
    # The disposable default branch only (see FIXTURE LAYOUT STANDARD above). branches:
    # cannot use a default_branch expression, so the name is hardcoded.
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # daily, off-peak (03:17 UTC)
  repository_dispatch:
    types: [ferralon-advisory-rescan]

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  security-events: write
  id-token: write

jobs:
  assess:
    name: Ferralon Assay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: false

      - name: Warm the module cache for the target
        # The scanner's Go analyzer loads the module with go/packages, which needs the
        # module graph resolvable on the runner — warm it before the scan.
        working-directory: target
        run: go build ./...

      - name: Run the Ferralon Assay
        id: scan
        uses: ferralon-ai/ferralon-assay@v0.3
        with:
          mode: baseline
          target: target
          out: ${{ runner.temp }}/out
          subject-repo: ${{ github.repository }}
          revision: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          # Persist the durable StateStore baseline only on the default branch. A PR run
          # (github.ref_name is "<n>/merge") stays stateless, so it never overwrites the
          # baseline. state-ref is the cross-team-contract ref the backend reader keys off.
          state-ref: refs/tegron/state
          state-repo: ${{ github.ref_name == github.event.repository.default_branch && github.repository || '' }}

      - name: Upload the scan report bundle (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: |
            ${{ steps.scan.outputs.out-dir }}/report.json
            ${{ steps.scan.outputs.out-dir }}/report.html
            ${{ steps.scan.outputs.out-dir }}/report.sarif.json
            ${{ steps.scan.outputs.out-dir }}/openvex.json
          if-no-files-found: error
